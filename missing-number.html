/* =====================================================
   OPTIONS
===================================================== */

function makeOptions(correct){

 let n=Number(correct);

 let candidates=[
   n-4,
   n+3,
   n+7,
   n+11
 ];

 let pos=(current*7)%4;

 let arr=new Array(4);

 arr[pos]=String(correct);

 let others=candidates.filter(x=>x!==n);

 let k=0;

 for(let i=0;i<4;i++){

   if(arr[i]===undefined){

     arr[i]=String(others[k]);

     k++;
   }
 }

 return arr;
}


/* =====================================================
   LOAD QUESTION
===================================================== */

let current=0;
let score=0;
let locked=false;

function loadQuestion(){

 locked=false;

 let q=questions[current];

 document.getElementById("qn").textContent=current+1;

 document.getElementById("qtitle").textContent=
 "प्रश्न "+(current+1);

 document.getElementById("bar").style.width=
 ((current+1)/200*100)+"%";


 document.getElementById("question").textContent=
 "निम्नलिखित संख्या श्रेणी में (?) के स्थान पर क्या आएगा?";


 let series="";

 q.seq.forEach(function(x){

   if(x==="?"){

     series+='<span class="box missing">?</span>';

   }else{

     series+='<span class="box">'+x+'</span>';

   }

 });


 document.getElementById("series").innerHTML=series;


 let options=makeOptions(q.ans);

 let correctIndex=options.indexOf(String(q.ans));

 let box=document.getElementById("options");

 box.innerHTML="";


 options.forEach(function(opt,i){

   let div=document.createElement("div");

   div.className="option";

   div.textContent=
   "विकल्प "+String.fromCharCode(65+i)+": "+opt;

   div.onclick=function(){

     check(div,i,correctIndex);

   };

   box.appendChild(div);

 });


 let fb=document.getElementById("feedback");

 fb.className="feedback";
 fb.style.display="none";
 fb.innerHTML="";

 document.getElementById("next").style.display="none";
}


/* =====================================================
   CHECK ANSWER
===================================================== */

function check(clicked,selected,correct){

 if(locked)return;

 locked=true;

 let all=document.querySelectorAll(".option");

 let letter=
 String.fromCharCode(65+correct);

 if(selected===correct){

   score++;

   clicked.classList.add("correct");

   document.getElementById("feedback").className=
   "feedback good";

   document.getElementById("feedback").innerHTML=
   "✅ सही! सही उत्तर: विकल्प "+letter+
   " ("+questions[current].ans+")";

 }else{

   clicked.classList.add("wrong");

   all[correct].classList.add("correct");

   document.getElementById("feedback").className=
   "feedback bad";

   document.getElementById("feedback").innerHTML=
   "❌ गलत! सही उत्तर: विकल्प "+letter+
   " ("+questions[current].ans+")";
 }

 document.getElementById("feedback").style.display="block";

 document.getElementById("score").textContent=score;

 document.getElementById("next").style.display="block";
}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

 current++;

 if(current>=questions.length){

   finish();

 }else{

   loadQuestion();

   window.scrollTo(0,0);
 }
}


/* =====================================================
   RESULT
===================================================== */

function finish(){

 document.getElementById("quiz").style.display="none";

 document.getElementById("result").style.display="block";

 let percent=
 Math.round(score/questions.length*100);

 document.getElementById("final").textContent=
 "आपका स्कोर: "+score+" / 200";

 document.getElementById("percent").textContent=
 "प्रतिशत: "+percent+"%";
}


/* =====================================================
   RESTART
===================================================== */

function restart(){

 current=0;
 score=0;
 locked=false;

 document.getElementById("score").textContent="0";

 document.getElementById("result").style.display="none";

 document.getElementById("quiz").style.display="block";

 loadQuestion();

 window.scrollTo(0,0);
}
