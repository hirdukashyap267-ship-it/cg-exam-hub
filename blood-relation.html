<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Venn Diagram Quiz 200 | CG Exam Hub</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#eef2ff;

 font-family:Arial,"Noto Sans Devanagari",sans-serif
}
header{

 font-weight:bold

svg{width:100%;height:190px;display:block}

 border-radius:12px;

 font-weight:bold
}
.good{display:block;background:#dcfce7;color:#166534}
.bad{display:block;background:#fee2e2;color:#991b1b}
.next{
 display:none;
 width:100%;

 padding:14px;

 font-size:17px;
 font-weight:bold

.restart{

 border:0;
 border-radius:12px;
 background:#2563eb;
 color:#fff;
 font-weight:bold
}
@media(max-width:650px){
 .options{grid-template-columns:1fr}
 .question{font-size:17px}
}
</style>
</head>

<body>

<header>
<h1>🧠 Venn Diagram Quiz</h1>
<p>CG Exam Hub • 200 Mixed Questions</p>
<a class="home" href="reasoning.html">← Reasoning Home</a>
</header>

<div class="container">

<div class="top">
<b>प्रश्न <span id="qn">1</span> / 200</b>
<span style="float:right">स्कोर: <b id="score">0</b></span>
<div class="progress"><div id="bar"></div></div>
</div>

<div class="quiz" id="quiz">
<div class="qno" id="qtitle"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>

<div id="feedback" class="feedback"></div>

<button id="next" class="next" onclick="nextQuestion()">
अगला प्रश्न →
</button>
</div>

<div class="result" id="result">
<h2>🎉 Quiz पूरा हुआ!</h2>
<h3 id="final"></h3>
<p id="percent"></p>
<button class="restart" onclick="restart()">फिर से शुरू करें</button>
</div>

</div>

<script>

===================================================== */

const groups=[

/* 22 */

/* 24 */

/* 25 */
["वाहन","जल वाहन","वायु वाहन",

/* 28 */
["संचार","डिजिटल संचार","पारंपरिक संचार",

/* 29 */
["पौधा","फूलदार पौधे","फलदार पौधे",

/* 30 */
["जीव","जलचर","स्थलचर",
["मछली","व्हेल","डॉल्फिन","शार्क","ऑक्टोपस"]],

/* 31 */
["खाद्य पदार्थ","डेयरी उत्पाद","अनाज",
["दूध","दही","पनीर","मक्खन","छाछ"]],

/* 32 */
["विज्ञान","खगोल विज्ञान","जीव विज्ञान",
["ग्रह","तारे","आकाशगंगा","उपग्रह","नीहारिका"]],

/* 33 */
["वाहन","सार्वजनिक वाहन","निजी वाहन",
["बस","मेट्रो","ट्राम","सार्वजनिक टैक्सी","सिटी बस"]],

/* 34 */
["कंप्यूटर","स्टोरेज उपकरण","इनपुट उपकरण",
["हार्ड डिस्क","SSD","पेन ड्राइव","मेमोरी कार्ड","CD"]],

/* 35 */
["देश","एशियाई देश","यूरोपीय देश",
["भारत","चीन","नेपाल","जापान","भूटान"]],

/* 36 */
["कार्यालय","कर्मचारी","अधिकारी",
["लिपिक","सहायक कर्मचारी","कार्यालय कर्मचारी","लेखा कर्मचारी","तकनीकी कर्मचारी"]],

/* 37 */
["संख्या","प्राकृतिक संख्या","ऋणात्मक संख्या",
["1","2","3","4","5"]],

/* 38 */
["कला","संगीत","चित्रकला",
["गायन","वाद्य संगीत","शास्त्रीय संगीत","लोक संगीत","संगीत रचना"]],

/* 39 */
["पर्यावरण","प्राकृतिक संसाधन","मानव निर्मित संसाधन",
["जल","वन","मिट्टी","खनिज","वायु"]],

/* 40 */
["संचार माध्यम","समाचार माध्यम","मनोरंजन माध्यम",
["समाचार पत्र","समाचार चैनल","समाचार वेबसाइट","समाचार पत्रिका","रेडियो समाचार"]]

];


/* =====================================================
   200 QUESTIONS बनाना
   सभी category को MIX करके
===================================================== */

let questions=[];

for(let round=0;round<5;round++){

    for(let g=0;g<groups.length;g++){

        let x=groups[g];

        questions.push({
            outer:x[0],
            left:x[1],
            right:x[2],
            inner:x[3][round]
        });

    }

}


/* =====================================================
   QUESTION के अंदर शब्द MIX
===================================================== */

function shuffle(arr,seed){

    let a=arr.slice();
    let x=seed;

    for(let i=a.length-1;i>0;i--){

        x=(x*9301+49297)%233280;

        let j=Math.floor((x/233280)*(i+1));

        [a[i],a[j]]=[a[j],a[i]];
    }

    return a;
}


/* =====================================================
   SVG TEXT
===================================================== */

function label(x,y,text,size){

    return '<text x="'+x+'" y="'+y+
    '" text-anchor="middle" font-size="'+size+
    '" font-weight="bold" fill="#111827">'+
    text+'</text>';
}


/* =====================================================
   VENN DIAGRAM
===================================================== */

function venn(q,type){

    let s='<svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">';


    /* सही:
       OUTER
       ├── LEFT
       │    └── INNER
       └── RIGHT
    */

    if(type===0){

        s+=
        '<circle cx="180" cy="95" r="82" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>'+
        '<circle cx="120" cy="105" r="43" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>'+
        '<circle cx="240" cy="105" r="43" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>'+
        '<circle cx="120" cy="115" r="20" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>';

        s+=label(180,28,q.outer,11);
        s+=label(120,82,q.left,9);
        s+=label(240,82,q.right,9);
        s+=label(120,119,q.inner,8);
    }


    /* गलत:
       INNER गलत RIGHT में
    */

    if(type===1){

        s+=
        '<circle cx="180" cy="95" r="82" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>'+
        '<circle cx="120" cy="105" r="43" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>'+
        '<circle cx="240" cy="105" r="43" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>'+
        '<circle cx="240" cy="115" r="20" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>';

        s+=label(180,28,q.outer,11);
        s+=label(120,82,q.left,9);
        s+=label(240,82,q.right,9);
        s+=label(240,119,q.inner,8);
    }


    /* गलत:
       सभी अलग
    */

    if(type===2){

        s+=
        '<circle cx="180" cy="95" r="82" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>'+
        '<circle cx="100" cy="105" r="27" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>'+
        '<circle cx="180" cy="105" r="27" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>'+
        '<circle cx="260" cy="105" r="27" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>';

        s+=label(180,28,q.outer,11);
        s+=label(100,109,q.left,7);
        s+=label(180,109,q.right,7);
        s+=label(260,109,q.inner,7);
    }


    /* गलत:
       LEFT और RIGHT overlap
    */

    if(type===3){

        s+=
        '<circle cx="180" cy="95" r="82" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>'+
        '<circle cx="145" cy="105" r="48" fill="#dcfce7" fill-opacity=".7" stroke="#16a34a" stroke-width="3"/>'+
        '<circle cx="215" cy="105" r="48" fill="#fef3c7" fill-opacity=".7" stroke="#d97706" stroke-width="3"/>'+
        '<circle cx="180" cy="112" r="20" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>';

        s+=label(180,28,q.outer,11);
        s+=label(125,78,q.left,8);
        s+=label(235,78,q.right,8);
        s+=label(180,118,q.inner,8);
    }

    s+='</svg>';

    return s;
}


/* =====================================================
   सही उत्तर की position
   A/B/C/D पूरी तरह mixed
===================================================== */

const answerPos=[
1,2,3,0,2,0,3,1,3,1,
0,2,1,3,2,0,3,1,0,2,
3,1,2,0,1,3,0,2,3,1
];


/* =====================================================
   QUIZ
===================================================== */

let current=0;
let score=0;
let locked=false;


function loadQuestion(){

    locked=false;

    let q=questions[current];

    document.getElementById("qn").textContent=current+1;

    document.getElementById("qtitle").textContent=
    "प्रश्न "+(current+1);

    document.getElementById("bar").style.width=
    ((current+1)/200*100)+"%";


    /* Question में भी चारों शब्द MIX */

    let words=shuffle(
        [q.outer,q.left,q.right,q.inner],
        current+101
    );

    document.getElementById("question").textContent=
    "निम्नलिखित में से "+
    words.join(", ") +
    " में से सही संबंध दर्शाने वाला Venn Diagram चुनिए।";


    let correct=answerPos[current%answerPos.length];

    let wrongTypes=[1,2,3];
    let optionTypes=[];


    for(let i=0;i<4;i++){

        if(i===correct){

            optionTypes.push(0);

        }else{

            optionTypes.push(wrongTypes.shift());

        }
    }


    let box=document.getElementById("options");

    box.innerHTML="";


    for(let i=0;i<4;i++){

        let div=document.createElement("div");

        div.className="option";

        div.innerHTML=
        '<div class="opt">विकल्प '+
        String.fromCharCode(65+i)+
        '</div>'+
        venn(q,optionTypes[i]);


        div.onclick=function(){

            check(div,i,correct);

        };

        box.appendChild(div);
    }


    let fb=document.getElementById("feedback");

    fb.className="feedback";
    fb.style.display="none";
    fb.innerHTML="";

    document.getElementById("next").style.display="none";
}


/* =====================================================
   ANSWER
===================================================== */

function check(clicked,selected,correct){

    if(locked)return;

    locked=true;

    let all=document.querySelectorAll(".option");

    let answer=
    String.fromCharCode(65+correct);


    if(selected===correct){

        score++;

        clicked.classList.add("correct");

        document.getElementById("feedback").className=
        "feedback good";

        document.getElementById("feedback").innerHTML=
        "✅ सही! सही उत्तर: विकल्प "+answer;

    }else{

        clicked.classList.add("wrong");

        all[correct].classList.add("correct");

        document.getElementById("feedback").className=
        "feedback bad";

        document.getElementById("feedback").innerHTML=
        "❌ गलत! सही उत्तर: विकल्प "+answer;
    }


    document.getElementById("feedback").style.display="block";

    document.getElementById("score").textContent=score;

    document.getElementById("next").style.display="block";
}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

    current++;

    if(current>=200){

        finish();

    }else{

        loadQuestion();

        window.scrollTo(0,0);
    }
}


/* =====================================================
   FINISH
===================================================== */

function finish(){

    document.getElementById("quiz").style.display="none";

    document.getElementById("result").style.display="block";

    let p=Math.round(score/200*100);

    document.getElementById("final").textContent=
    "आपका स्कोर: "+score+" / 200";

    document.getElementById("percent").textContent=
    "प्रतिशत: "+p+"%";
}


/* =====================================================
   RESTART
===================================================== */

function restart(){

    current=0;
    score=0;
    locked=false;

    document.getElementById("score").textContent="0";

    document.getElementById("result").style.display="none";

    document.getElementById("quiz").style.display="block";

    loadQuestion();

    window.scrollTo(0,0);
}


/* START */

loadQuestion();

</script>

</body>
</html>
