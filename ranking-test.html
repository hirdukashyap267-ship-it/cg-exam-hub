/* =====================================================

   EXACTLY 200 CHECK
   ===================================================== */

console.log("TOTAL QUESTIONS =",questions.length);

if(questions.length!==200){
 document.body.innerHTML=
 `<h2 style="padding:30px;color:red">
 Error: Questions = ${questions.length}
 </h2>`;
}


/* =====================================================
   QUIZ ENGINE
   ===================================================== */

let current=0;
let score=0;
let answered=false;


/* Answer positions को mixed करना */
questions.forEach((q,i)=>{

 let correct=q.o[q.a];

 let arr=q.o.map((x,n)=>({
  text:x,
  old:n
 }));

 let shift=(i*3+1)%4;

 let mixed=[];

 for(let j=0;j<4;j++){
  mixed.push(arr[(j+shift)%4]);
 }

 q.o=mixed;
 q.a=q.o.findIndex(x=>x.text===correct);
});


function showQuestion(){

 answered=false;

 let q=questions[current];

 document.getElementById("progress").innerHTML=
 `📊 प्रश्न ${current+1} / 200
 &nbsp; | &nbsp; 🏆 अंक: ${score}`;

 let diagramHTML=q.diagram?
 `<div class="diagram">${q.diagram}</div>`:"";

 document.getElementById("quizBox").innerHTML=`

 <div class="qno">प्रश्न ${current+1}</div>

 <div class="level">${q.level}</div>

 <div class="questionText">
 <b>प्रश्न:</b><br>
 ${q.q}
 </div>

 ${diagramHTML}

 <b>सही विकल्प चुनिए:</b>

 <div id="options">

 ${q.o.map((x,i)=>`
 <div class="option" onclick="selectOption(${i})">
 <b>${String.fromCharCode(65+i)}.</b>
 ${x.text}
 </div>
 `).join("")}

 </div>

 <div id="feedback" class="feedback"></div>

 <button class="next" onclick="nextQuestion()">
 ${current===199?"🏆 परिणाम देखें":"अगला प्रश्न ➜"}
 </button>
 `;
}


function selectOption(index){

 if(answered)return;

 answered=true;

 let q=questions[current];
 let opts=document.querySelectorAll(".option");
 let feedback=document.getElementById("feedback");

 if(index===q.a){

  opts[index].classList.add("correct");

  score++;

  feedback.style.display="block";
  feedback.style.background="#d9f8df";
  feedback.style.color="#08752d";

  feedback.innerHTML=
  `✅ सही! सही उत्तर: विकल्प ${String.fromCharCode(65+q.a)}`;

 }else{

  opts[index].classList.add("wrong");
  opts[q.a].classList.add("correct");

  feedback.style.display="block";
  feedback.style.background="#ffe0e0";
  feedback.style.color="#a40000";

  feedback.innerHTML=
  `❌ गलत! सही उत्तर: विकल्प ${String.fromCharCode(65+q.a)}`;
 }

 document.getElementById("progress").innerHTML=
 `📊 प्रश्न ${current+1} / 200
 &nbsp; | &nbsp; 🏆 अंक: ${score}`;
}


function nextQuestion(){

 if(!answered){
  alert("पहले एक विकल्प चुनिए।");
  return;
 }

 current++;

 if(current<200){

  showQuestion();

  window.scrollTo({
   top:0,
   behavior:"smooth"
  });

 }else{

  showResult();
 }
}


function showResult(){

 document.getElementById("quizBox").style.display="none";
 document.getElementById("progress").style.display="none";

 let percentage=Math.round(score/200*100);

 let result=document.getElementById("result");

 result.style.display="block";

 result.innerHTML=`

 <h2>🎉 Ranking Test Complete!</h2>

 <div style="font-size:32px;font-weight:bold">
 ${score} / 200
 </div>

 <p style="font-size:19px">
 प्रतिशत: <b>${percentage}%</b>
 </p>

 <p>🏆 आपने पूरे 200 Ranking Questions पूरे किए।</p>

 <button class="restart" onclick="location.reload()">
 🔄 फिर से शुरू करें
 </button>
 `;
}


showQuestion();

</script>
