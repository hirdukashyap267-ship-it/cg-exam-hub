/* =================================================
   ANSWER POSITION BALANCING
   1st question = A
   2nd = B
   3rd = C
   4th = D
   फिर यही क्रम दोहरता है।

   200 questions = A 50, B 50, C 50, D 50
================================================= */

const preparedQuestions = questions.map((q,index)=>{

  let target = index % 4;

  let options = [...q[1]];

  let correct = options[0];

  options.splice(0,1);

  options.splice(target,0,correct);

  return [q[0],options,target];

});


let current=0;
let score=0;


function loadQuestion(){

 const q=preparedQuestions[current];

 document.getElementById("count").innerText=
 "प्रश्न "+(current+1)+" / "+preparedQuestions.length;

 document.getElementById("score").innerText=
 "स्कोर: "+score;

 document.getElementById("question").innerText=
 (current+1)+". "+q[0];

 const box=document.getElementById("options");
 box.innerHTML="";

 const feedback=document.getElementById("feedback");

 feedback.style.display="none";
 feedback.innerHTML="";

 document.getElementById("next").style.display="none";


 q[1].forEach((option,index)=>{

   const btn=document.createElement("button");

   btn.className="option";

   btn.innerText=
   String.fromCharCode(65+index)+". "+option;


   btn.onclick=function(){

     const all=document.querySelectorAll(".option");

     all.forEach(x=>x.disabled=true);


     if(index===q[2]){

       btn.classList.add("correct");

       score++;

       feedback.innerHTML="✅ सही उत्तर!";

       feedback.style.background="#dcfce7";
       feedback.style.color="#166534";
       feedback.style.display="block";

     }else{

       btn.classList.add("wrong");

       all[q[2]].classList.add("correct");

       feedback.innerHTML=
       "❌ गलत उत्तर!<br>सही उत्तर: "+
       String.fromCharCode(65+q[2])+
       ". "+q[1][q[2]];

       feedback.style.background="#fee2e2";
       feedback.style.color="#991b1b";
       feedback.style.display="block";
     }


     document.getElementById("score").innerText=
     "स्कोर: "+score;


     if(current<preparedQuestions.length-1){

       document.getElementById("next").style.display="block";

     }else{

       setTimeout(showResult,800);

     }

   };


   box.appendChild(btn);

 });


 document.getElementById("bar").style.width=
 ((current+1)/preparedQuestions.length*100)+"%";
}


function nextQuestion(){

 current++;

 if(current<preparedQuestions.length){

   loadQuestion();

   window.scrollTo({
     top:0,
     behavior:"smooth"
   });

 }else{

   showResult();

 }
}


function showResult(){

 document.getElementById("quizCard").style.display="none";

 document.getElementById("result").style.display="block";

 let percent=
 Math.round(score/preparedQuestions.length*100);

 document.getElementById("finalScore").innerHTML=
 "आपका स्कोर: <b>"+
 score+
 " / "+
 preparedQuestions.length+
 "</b><br><br>प्रतिशत: <b>"+
 percent+
 "%</b>";
}


function restartQuiz(){

 current=0;
 score=0;

 document.getElementById("quizCard").style.display="block";

 document.getElementById("result").style.display="none";

 loadQuestion();

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });
}


loadQuestion();

</script>
