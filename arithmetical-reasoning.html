/* =====================================================
   MIX OPTION POSITIONS
===================================================== */

function makeMixedOptions(q,index){

 let correct=q.o[q.a];

 let values=[...q.o];

 let positions=[
   index%4,
   (index*3+1)%4,
   (index*5+2)%4,
   (index*7+3)%4
 ];

 let target=positions[0];

 values=values.filter((x,i)=>i!==q.a);

 let result=new Array(4);

 result[target]=correct;

 let k=0;

 for(let i=0;i<4;i++){

   if(result[i]===undefined){
     result[i]=values[k++];
   }
 }

 return {
   options:result,
   correct:target
 };
}


/* =====================================================
   QUIZ
===================================================== */

let current=0;
let score=0;
let locked=false;


function loadQuestion(){

 locked=false;

 let q=questions[current];

 document.getElementById("qn").textContent=current+1;

 document.getElementById("qtitle").textContent=
 "प्रश्न "+(current+1);

 document.getElementById("bar").style.width=
 ((current+1)/200*100)+"%";

 document.getElementById("type").textContent=
 q.type;

 document.getElementById("question").textContent=
 q.q;

 document.getElementById("expression").textContent=
 q.e;

 let data=makeMixedOptions(q,current);

 let box=document.getElementById("options");

 box.innerHTML="";

 data.options.forEach(function(opt,i){

   let div=document.createElement("div");

   div.className="option";

   div.textContent=
   "विकल्प "+String.fromCharCode(65+i)+": "+opt;

   div.onclick=function(){
     checkAnswer(div,i,data.correct);
   };

   box.appendChild(div);
 });

 let fb=document.getElementById("feedback");

 fb.style.display="none";
 fb.className="feedback";
 fb.innerHTML="";

 document.getElementById("next").style.display="none";
}


function checkAnswer(clicked,selected,correct){

 if(locked)return;

 locked=true;

 let all=document.querySelectorAll(".option");

 let letter=
 String.fromCharCode(65+correct);

 let q=questions[current];

 let answer=q.o[q.a];

 if(selected===correct){

   score++;

   clicked.classList.add("correct");

   document.getElementById("feedback").className=
   "feedback good";

   document.getElementById("feedback").innerHTML=
   "✅ सही!<br>सही उत्तर: विकल्प "+
   letter+" ("+answer+")";

 }else{

   clicked.classList.add("wrong");

   all[correct].classList.add("correct");

   document.getElementById("feedback").className=
   "feedback bad";

   document.getElementById("feedback").innerHTML=
   "❌ गलत!<br>सही उत्तर: विकल्प "+
   letter+" ("+answer+")";
 }

 document.getElementById("feedback").style.display="block";

 document.getElementById("score").textContent=score;

 document.getElementById("next").style.display="block";
}


function nextQuestion(){

 current++;

 if(current>=questions.length){
   finish();
 }else{
   loadQuestion();
   window.scrollTo(0,0);
 }
}


function finish(){

 document.getElementById("quiz").style.display="none";

 document.getElementById("result").style.display="block";

 let percent=Math.round(score/200*100);

 document.getElementById("final").textContent=
 "आपका स्कोर: "+score+" / 200";

 document.getElementById("percent").textContent=
 "प्रतिशत: "+percent+"%";
}


function restart(){

 current=0;
 score=0;
 locked=false;

 document.getElementById("score").textContent="0";

 document.getElementById("result").style.display="none";

 document.getElementById("quiz").style.display="block";

 loadQuestion();

 window.scrollTo(0,0);
}


loadQuestion();

</script>
