/* =========================================================
   SHUFFLE SYSTEM
   प्रश्न के अंदर भी चारों items MIX होंगे।
   Options भी अलग क्रम में MIX होंगे।
========================================================= */

function mulberry32(a){
 return function(){
   let t=a+=0x6D2B79F5;
   t=Math.imul(t^t>>>15,t|1);
   t^=t+Math.imul(t^t>>>7,t|61);
   return ((t^t>>>14)>>>0)/4294967296;
 }
}

const rng=mulberry32(20260915);

function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
   const j=Math.floor(rng()*(i+1));
   [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

   `निम्नलिखित में से ${promptItems[0]}, ${promptItems[1]}, ${promptItems[2]} और ${promptItems[3]} में से क्या अलग है?`,
   options:options,
   correct:correct
 };
});


let current=0;
let score=0;
let answered=false;
let answerKey=[];

const quiz=document.getElementById("quiz");
const result=document.getElementById("result");
const count=document.getElementById("count");
const scoreBox=document.getElementById("score");
const bar=document.getElementById("bar");

function loadQuestion(){

 answered=false;

 const q=questions[current];

 count.textContent=current+1;
 scoreBox.textContent=score;

 bar.style.width=((current)/questions.length*100)+"%";

 quiz.innerHTML="";

 const qno=document.createElement("div");
 qno.className="qno";
 qno.textContent="प्रश्न "+(current+1);

 const question=document.createElement("div");
 question.className="question";
 question.textContent=q.prompt;

 quiz.appendChild(qno);
 quiz.appendChild(question);

 q.options.forEach((opt,i)=>{

   const btn=document.createElement("button");
   btn.className="option";
   btn.textContent=String.fromCharCode(65+i)+") "+opt;

   btn.onclick=()=>checkAnswer(btn,i,q);

   quiz.appendChild(btn);
 });

 const feedback=document.createElement("div");
 feedback.id="feedback";
 feedback.className="feedback";
 quiz.appendChild(feedback);

 const next=document.createElement("button");
 next.className="next";
 next.textContent=current===questions.length-1
   ?"🏁 परिणाम देखें"
   :"➡️ अगला प्रश्न";

 next.disabled=true;

 next.onclick=()=>{
   current++;

   if(current<questions.length){
      loadQuestion();
   }else{
      showResult();
   }
 };

 quiz.appendChild(next);
}

function checkAnswer(btn,index,q){

 if(answered)return;

 answered=true;

 const buttons=quiz.querySelectorAll(".option");
 const feedback=document.getElementById("feedback");
 const next=quiz.querySelector(".next");

 buttons.forEach(b=>b.disabled=true);

 if(index===q.correct){

   btn.classList.add("correct");
   feedback.textContent="✅ सही उत्तर!";
   score++;

 }else{

   btn.classList.add("wrong");
   feedback.textContent="❌ गलत उत्तर!";
 }

 answerKey.push(String.fromCharCode(65+q.correct));

 scoreBox.textContent=score;
 next.disabled=false;
}

function showResult(){

 quiz.style.display="none";
 result.style.display="block";

 const percent=Math.round(score/questions.length*100);

 let keyHTML="";

 answerKey.forEach((ans,i)=>{
   keyHTML+=`<b>${i+1}.</b> ${ans} &nbsp;&nbsp;`;
 });

 result.innerHTML=`
   <h2>🎉 Quiz पूरा हुआ!</h2>
   <h3>CG Exam Hub</h3>

   <p style="font-size:22px;font-weight:bold">
   ${score} / ${questions.length}
   </p>

   <p style="font-size:18px">
   प्रतिशत: <b>${percent}%</b>
   </p>

   <button class="restart" onclick="location.reload()">
   🔄 फिर से शुरू करें
   </button>

   <div class="key">
   <h3>📋 Answer Key</h3>
   ${keyHTML}
   </div>
 `;
}

loadQuestion();

</script>

</body>
</html>
