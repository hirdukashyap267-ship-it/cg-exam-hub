<h3>प्रश्न 1</h3>

<p>छत्तीसगढ़ की राजधानी क्या है?</p>

<button class="option" onclick="checkAnswer(this,false)">A. बिलासपुर</button><br><br>

<button class="option" onclick="checkAnswer(this,true)">B. रायपुर</button><br><br>

<button class="option" onclick="checkAnswer(this,false)">C. दुर्ग</button><br><br>

<button class="option" onclick="checkAnswer(this,false)">D. अंबिकापुर</button>

<script>
function checkAnswer(button, correct){
let result=document.getElementById("result");

if(correct){
button.style.background="green";
result.innerHTML="✅ सही उत्तर!";
result.style.color="green";
}else{
button.style.background="red";
result.innerHTML="❌ गलत उत्तर!";
result.style.color="red";
}
}
</script>
