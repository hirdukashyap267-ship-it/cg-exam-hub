body{

.container{

.top{

.badge{

.progressBox{

}

.progress{
  height:10px;

  border-radius:20px;

}

.progressBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#06b6d4,#6366f1,#ec4899);

}

.card{
  background:white;
  border-radius:20px;
  padding:20px;

}

.qno{

  font-weight:bold;
  margin-bottom:12px;
}

.question{
  font-size:20px;
  font-weight:bold;

  margin-bottom:18px;
}

.series{
  background:linear-gradient(135deg,#fef3c7,#dbeafe);

  padding:17px 10px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:20px;
  overflow-wrap:anywhere;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.option{
  border:0;
  min-height:58px;
  border-radius:15px;
  padding:12px;
  font-size:17px;
  font-weight:bold;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 10px #0002;
  transition:.2s;
}

.option:nth-child(1){
  background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.option:nth-child(2){
  background:linear-gradient(135deg,#059669,#10b981);
}

.option:nth-child(3){
  background:linear-gradient(135deg,#ea580c,#f97316);
}

.option:nth-child(4){
  background:linear-gradient(135deg,#9333ea,#a855f7);
}

.option:hover{
  transform:translateY(-2px);
}

.option.correct{
  background:#16a34a !important;
  box-shadow:0 0 0 4px #bbf7d0;
}

.option.wrong{
  background:#dc2626 !important;
  box-shadow:0 0 0 4px #fecaca;
}

.option:disabled{
  cursor:not-allowed;
  opacity:.95;
}

.feedback{
  min-height:28px;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
  text-align:center;
}

.nextBtn{
  display:none;
  width:100%;
  margin-top:15px;
  border:0;
  border-radius:15px;
  padding:15px;
  background:linear-gradient(135deg,#111827,#374151);
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.result{
  display:none;
  text-align:center;
}

.result h2{
  font-size:28px;
  color:#4f46e5;
}

.scoreBig{
  font-size:42px;
  font-weight:bold;
  margin:15px;
}

.restart{
  border:0;
  background:linear-gradient(135deg,#4f46e5,#db2777);
  color:white;
  padding:14px 25px;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
}

.answerKey{
  margin-top:20px;
  background:#f8fafc;
  border-radius:15px;
  padding:15px;
  text-align:left;
  line-height:2;

.home{

/* =====================================================
   QUIZ ENGINE
   ===================================================== */

let index = 0;
let score = 0;
let answered = false;
let answerList = [];

const currentEl = document.getElementById("current");
const scoreEl = document.getElementById("score");
const qnoEl = document.getElementById("qno");
const questionEl = document.getElementById("question");
const seriesEl = document.getElementById("series");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const progressBar = document.getElementById("progressBar");

function loadQuestion(){

  answered = false;

  const q = questions[index];

  currentEl.textContent = index + 1;
  qnoEl.textContent = "प्रश्न " + (index + 1);

  questionEl.textContent = q[0];
  seriesEl.textContent = q[1];

  optionsEl.innerHTML = "";
  feedbackEl.textContent = "";
  nextBtn.style.display = "none";

  const letters = ["A","B","C","D"];

  q[2].forEach((option,i)=>{

    const btn = document.createElement("button");

    btn.className = "option";

    btn.innerHTML = letters[i] + ") " + option;

    btn.onclick = function(){
      checkAnswer(i,btn);
    };

    optionsEl.appendChild(btn);

  });

  progressBar.style.width =
    ((index + 1) / questions.length * 100) + "%";
}

function checkAnswer(selected,clickedBtn){

  if(answered) return;

  answered = true;

  const q = questions[index];
  const correct = q[3];

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach(btn=>{
    btn.disabled = true;
  });

  if(selected === correct){

    clickedBtn.classList.add("correct");

    score++;

    feedbackEl.innerHTML =
      "✅ सही उत्तर!";

    feedbackEl.style.color = "#15803d";

  }else{

    clickedBtn.classList.add("wrong");

    feedbackEl.innerHTML =
      "❌ गलत उत्तर!";

    feedbackEl.style.color = "#dc2626";

    buttons[correct].classList.add("correct");

  }

  scoreEl.textContent = score;

  answerList.push(
    (index + 1) + " - " +
    ["A","B","C","D"][correct]
  );

  nextBtn.style.display = "block";

}

nextBtn.onclick = function(){

  index++;

  if(index < questions.length){

    loadQuestion();

  }else{

    showResult();

  }

};

function showResult(){

  document.getElementById("quizCard").style.display = "none";

  const result =
    document.getElementById("result");

  result.style.display = "block";

  document.getElementById("finalScore").textContent =
    score;

  const percent =
    Math.round((score / questions.length) * 100);

  document.getElementById("percentage").textContent =
    "आपका प्रतिशत: " + percent + "%";

  document.getElementById("answerKey").textContent =
    answerList.join("   |   ");

}

function restartQuiz(){

  index = 0;
  score = 0;
  answered = false;
  answerList = [];

  scoreEl.textContent = "0";

  document.getElementById("result").style.display = "none";
  document.getElementById("quizCard").style.display = "block";

  loadQuestion();

}

loadQuestion();
