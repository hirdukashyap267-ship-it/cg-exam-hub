/* =====================================================
   SVG DIRECTION DIAGRAM
===================================================== */

function makeDiagram(q){

 let svg=
 '<svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">'+

 '<defs>'+
 '<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">'+
 '<path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/>'+
 '</marker>'+
 '</defs>'+

 '<line x1="180" y1="25" x2="180" y2="195" stroke="#94a3b8" stroke-width="2"/>'+
 '<line x1="45" y1="110" x2="315" y2="110" stroke="#94a3b8" stroke-width="2"/>'+

 '<text x="180" y="17" text-anchor="middle" font-size="16" font-weight="bold">उत्तर</text>'+
 '<text x="180" y="216" text-anchor="middle" font-size="16" font-weight="bold">दक्षिण</text>'+
 '<text x="25" y="115" text-anchor="middle" font-size="16" font-weight="bold">पश्चिम</text>'+
 '<text x="335" y="115" text-anchor="middle" font-size="16" font-weight="bold">पूर्व</text>'+

 '<circle cx="180" cy="110" r="8" fill="#7c3aed"/>'+
 '<text x="180" y="103" text-anchor="middle" font-size="11" font-weight="bold">आरंभ</text>';

 let x=180,y=110;

 let scale=3.5;

 for(let m of (q.moves||[])){

   let nx=x,ny=y;

   if(m[0]==="उत्तर") ny-=m[1]*scale;
   if(m[0]==="दक्षिण") ny+=m[1]*scale;
   if(m[0]==="पूर्व") nx+=m[1]*scale;
   if(m[0]==="पश्चिम") nx-=m[1]*scale;

   nx=Math.max(55,Math.min(305,nx));
   ny=Math.max(30,Math.min(190,ny));

   svg+=
   '<line x1="'+x+'" y1="'+y+'" x2="'+nx+'" y2="'+ny+
   '" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>';

   x=nx;
   y=ny;
 }

 svg+=
 '<circle cx="'+x+'" cy="'+y+'" r="10" fill="#ef4444"/>'+
 '<text x="'+x+'" y="'+(y-15)+'" text-anchor="middle" font-size="12" font-weight="bold">अंतिम</text>'+
 '</svg>';

 return svg;
}


/* =====================================================
   OPTIONS
===================================================== */

const directions=[
"उत्तर",
"दक्षिण",
"पूर्व",
"पश्चिम",
"उत्तर-पूर्व",
"उत्तर-पश्चिम",
"दक्षिण-पूर्व",
"दक्षिण-पश्चिम",
"उसी स्थान पर"
];

const distanceOptions={
"10":["8","10","12","14"],
"13":["11","13","15","17"],
"15":["12","15","18","20"],
"17":["14","16","17","19"],
"20":["18","20","22","24"],
"25":["20","23","25","28"],
"26":["22","24","26","28"],
"29":["26","27","29","31"],
"30":["25","28","30","32"]
};

const answerPositions=[
1,3,0,2,3,1,2,0,1,3,
2,0,3,1,0,2,1,3,2,0,
3,1,0,2,1,3,2,0,3,1
];


/* =====================================================
   LOAD
===================================================== */

let current=0;
let score=0;
let locked=false;

function loadQuestion(){

 locked=false;

 let q=questions[current];

 document.getElementById("qn").textContent=current+1;
 document.getElementById("qtitle").textContent="प्रश्न "+(current+1);

 document.getElementById("bar").style.width=
 ((current+1)/200*100)+"%";

 let text="";

 if(q.distance){

   text="एक व्यक्ति प्रारंभिक स्थान से "+q.moves.map(x=>x[1]+" मीटर "+x[0]).join(" चलता है। "+ 
   "इसके बाद ")+"। "+q.ask;

 }else{

   text="एक व्यक्ति प्रारंभिक स्थान से ";

   if(q.moves){

     text+=q.moves.map(x=>x[1]+" मीटर "+x[0]).join(" और ");

     text+=" चलता है। ";
   }

   text+=q.ask;
 }

 document.getElementById("question").textContent=text;


 if(q.moves){
   document.getElementById("diagram").style.display="block";
   document.getElementById("diagram").innerHTML=makeDiagram(q);
 }else{
   document.getElementById("diagram").style.display="none";
 }


 let correct=q.ans;

 let opts;

 if(q.distance){

   opts=distanceOptions[correct].slice();

 }else{

   opts=directions.filter(x=>x!==correct).slice(0,3);
   opts.push(correct);

 }


 /* options को deterministic mix */

 let shift=(current*7)%4;

 let finalOpts=[];

 for(let i=0;i<4;i++){
   finalOpts.push(opts[(i+shift)%4]);
 }


 let correctIndex=finalOpts.indexOf(correct);


 /* target answer position को mixed रखने के लिए swap */

 let target=answerPositions[current%answerPositions.length];

 [finalOpts[correctIndex],finalOpts[target]]=
 [finalOpts[target],finalOpts[correctIndex]];

 correctIndex=target;


 let box=document.getElementById("options");

 box.innerHTML="";

 finalOpts.forEach((opt,i)=>{

   let div=document.createElement("div");

   div.className="option";

   div.textContent=
   "विकल्प "+String.fromCharCode(65+i)+": "+opt;

   div.onclick=function(){
     check(div,i,correctIndex);
   };

   box.appendChild(div);
 });


 let fb=document.getElementById("feedback");

 fb.className="feedback";
 fb.style.display="none";
 fb.innerHTML="";

 document.getElementById("next").style.display="none";
}


/* =====================================================
   CHECK
===================================================== */

function check(clicked,selected,correct){

 if(locked)return;

 locked=true;

 let all=document.querySelectorAll(".option");

 let letter=String.fromCharCode(65+correct);

 if(selected===correct){

   score++;

   clicked.classList.add("correct");

   document.getElementById("feedback").className=
   "feedback good";

   document.getElementById("feedback").innerHTML=
   "✅ सही! सही उत्तर: विकल्प "+letter;

 }else{

   clicked.classList.add("wrong");

   all[correct].classList.add("correct");

   document.getElementById("feedback").className=
   "feedback bad";

   document.getElementById("feedback").innerHTML=
   "❌ गलत! सही उत्तर: विकल्प "+letter;
 }

 document.getElementById("feedback").style.display="block";

 document.getElementById("score").textContent=score;

 document.getElementById("next").style.display="block";
}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

 current++;

 if(current>=questions.length){

   finish();

 }else{

   loadQuestion();

   window.scrollTo(0,0);
 }
}


/* =====================================================
   FINISH
===================================================== */

function finish(){

 document.getElementById("quiz").style.display="none";

 document.getElementById("result").style.display="block";

 let percent=Math.round(score/questions.length*100);

 document.getElementById("final").textContent=
 "आपका स्कोर: "+score+" / "+questions.length;

 document.getElementById("percent").textContent=
 "प्रतिशत: "+percent+"%";
}


/* =====================================================
   RESTART
===================================================== */

function restart(){

 current=0;
 score=0;
 locked=false;

 document.getElementById("score").textContent="0";

 document.getElementById("result").style.display="none";

 document.getElementById("quiz").style.display="block";

 loadQuestion();

 window.scrollTo(0,0);
}


/* START */

loadQuestion();

</script>
